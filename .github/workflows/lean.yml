name: Trace-Euclidean Lean checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-euclidean-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the pinned Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: Trace-Euclidean/lean
          auto-config: false
          build: true
          use-mathlib-cache: true

      - name: Reject unfinished or non-kernel proof constructs in kernel-only modules
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '(^|[^[:alpha:]])sorry([^[:alpha:]]|$)|sorryAx|^[[:space:]]*axiom[[:space:]]|native_decide|run_tac|^[[:space:]]*unsafe[[:space:]]|^[[:space:]]*extern[[:space:]]|implemented_by' -- 'Trace-Euclidean/lean/*.lean' 'Trace-Euclidean/lean/**/*.lean' ':(exclude)Trace-Euclidean/lean/LeanCert/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15OdlyzkoNumerical.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15VoightDiscriminantData.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15VoightResultantCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15VoightIrreducibilityCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15VoightIrreducibilityCertificates.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15VoightExceptionalIrreducibilityCertificates.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15VoightAllIrreducible.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/V15VoightTotalRealityCertificates/**'; then
            echo 'Forbidden proof construct found.' >&2
            exit 1
          fi

      - name: Reject unfinished constructs in numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          # These files use native_decide; its compiler trust is audited separately.
          if git grep -n -E '^[[:space:]]*(sorry|axiom|unsafe|extern|run_tac)([[:space:]]|$)|sorryAx|implemented_by' -- 'Trace-Euclidean/lean/LeanCert/**/*.lean' 'Trace-Euclidean/lean/TraceEuclidean/V15OdlyzkoNumerical.lean' 'Trace-Euclidean/lean/TraceEuclidean/V15VoightDiscriminantData.lean' 'Trace-Euclidean/lean/TraceEuclidean/V15VoightResultantCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/V15VoightIrreducibilityCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/V15VoightIrreducibilityCertificates.lean' 'Trace-Euclidean/lean/TraceEuclidean/V15VoightExceptionalIrreducibilityCertificates.lean' 'Trace-Euclidean/lean/TraceEuclidean/V15VoightAllIrreducible.lean' 'Trace-Euclidean/lean/TraceEuclidean/V15VoightTotalRealityCertificates/**'; then
            echo 'Unfinished construct found in a numerical dependency.' >&2
            exit 1
          fi

      - name: Check public signatures and transitive axiom sets
        working-directory: Trace-Euclidean/lean
        shell: bash
        run: |
          set -euo pipefail
          lake env lean TraceEuclideanTest/MainTheoremAudit.lean > theorem-audit.log 2>&1
          cat theorem-audit.log
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('TraceEuclideanTest/MainTheoremAudit.lean').read_text(encoding='utf-8')
          output = ' '.join(Path('theorem-audit.log').read_text(encoding='utf-8').split())
          names = re.findall(r'^#print axioms\s+(\S+)', source, re.M)
          rows = re.findall(r"'([^']+)' depends on axioms: \[([^]]*)\]", output)
          reports = dict(rows)
          if len(rows) != len(names) or set(reports) != set(names):
              raise SystemExit(
                  f'Expected {len(names)} main axiom reports, found {len(rows)}'
              )
          standard = {'propext', 'Classical.choice', 'Quot.sound'}
          for name in names:
              axioms = {
                  item.strip().rstrip('✝')
                  for item in reports[name].split(',') if item.strip()
              }
              if not axioms <= standard:
                  raise SystemExit(f'Unexpected axiom set for {name}: {axioms}')
          print(f'MAIN AXIOM AUDIT: PASS ({len(names)} declarations)')
          PY
          rm theorem-audit.log

      - name: Audit the numerical compiler trust boundary
        working-directory: Trace-Euclidean/lean
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f numerical-audit.log' EXIT
          lake env lean TraceEuclideanTest/NumericalAxiomAudit.lean > numerical-audit.log 2>&1
          cat numerical-audit.log
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('TraceEuclideanTest/NumericalAxiomAudit.lean').read_text(encoding='utf-8')
          output = ' '.join(Path('numerical-audit.log').read_text(encoding='utf-8').split())
          names = re.findall(r'^#print axioms\s+(\S+)', source, re.M)
          if len(names) != 59:
              raise SystemExit(f'Expected fifty-nine numerical audit declarations, found {len(names)}')
          standard = {'propext', 'Classical.choice', 'Quot.sound'}
          sinh = 'TraceEuclidean.V15OdlyzkoNumerical.sinh_core_upper._native.native_decide.ax_1_1'
          cosh = 'TraceEuclidean.V15OdlyzkoNumerical.cosh_core_upper._native.native_decide.ax_1_1'
          gamma = 'EulerMascheroni.harmonic_N_ge._native.native_decide.ax_1_2'
          scalar_a = 'TraceEuclidean.V15OdlyzkoNumerical.scalarA_strict._native.native_decide.ax_1_1'
          scalar_b = 'TraceEuclidean.V15OdlyzkoNumerical.scalarB_strict._native.native_decide.ax_1_1'
          voight = 'TraceEuclidean.v15_voightDiscriminantData_certificate._native.native_decide.ax_1_1'
          voight_rows = 'TraceEuclidean.v15_voightPolynomialRowData_certificate._native.native_decide.ax_1_1'
          certificate_dir = Path('TraceEuclidean/V15VoightResultantCertificates')
          certificate_names = []
          for path in certificate_dir.glob('*.lean'):
              certificate_names.extend(re.findall(
                  r'^theorem\s+(\S+)', path.read_text(encoding='utf-8'), re.M
              ))
          voight_resultants = {
              'TraceEuclidean.' + name + '._native.native_decide.ax_1_1'
              for name in certificate_names
          }
          expected = {name: standard for name in names[:4]}
          expected[names[4]] = standard | {sinh}
          expected[names[5]] = standard | {cosh}
          expected[names[6]] = standard | {sinh, cosh, gamma, scalar_a, scalar_b}
          for name in names[7:32]:
              expected[name] = standard | {sinh, cosh, gamma, scalar_a, scalar_b}
          expected[names[32]] = {voight}
          expected[names[33]] = {voight_rows}
          expected[names[34]] = standard | {voight}
          expected[names[35]] = standard
          for name in names[36:42]:
              expected[name] = standard | {
                  sinh, cosh, gamma, scalar_a, scalar_b, voight
              }
          for name in names[42:]:
              expected[name] = standard | {sinh, cosh, gamma, scalar_a, scalar_b}
          expected[names[48]] = {voight_rows}
          expected[names[49]] = standard | voight_resultants
          for name in names[50:53]:
              expected[name] = standard | {voight_rows} | voight_resultants

          native = lambda theorem: (
              'TraceEuclidean.' + theorem + '._native.native_decide.ax_1_1'
          )
          rabin_dir = Path('TraceEuclidean/V15VoightIrreducibilityCertificates')
          rabin_checks = {
              native(theorem)
              for path in rabin_dir.glob('*.lean')
              for theorem in re.findall(
                  r'^theorem\s+(\S+_check)\s*:',
                  path.read_text(encoding='utf-8'), re.M
              )
          }
          umbrella_source = Path(
              'TraceEuclidean/V15VoightIrreducibilityCertificates.lean'
          ).read_text(encoding='utf-8')
          regular_partitions = {
              native(theorem)
              for theorem in re.findall(
                  r'^theorem\s+(\S+_rabin_irreducible)\s*:',
                  umbrella_source, re.M
              )
          }
          exceptional_source = Path(
              'TraceEuclidean/V15VoightExceptionalIrreducibilityCertificates.lean'
          ).read_text(encoding='utf-8')
          multi_checks = {
              native(theorem)
              for theorem in re.findall(
                  r'^theorem\s+(v15_voightMultiPrimeCertificates\S+_check)\s*:',
                  exceptional_source, re.M
              )
          }
          special_checks = {
              native(theorem)
              for theorem in re.findall(
                  r'^theorem\s+(v15_voightSpecialEight\S+)\s*:',
                  exceptional_source, re.M
              )
          }
          exception_partitions = {
              native(
                  'v15_voightRabinExceptions' + degree + '_irreducible'
              )
              for degree in ('Six', 'Eight', 'Nine', 'Ten')
          }
          all_irreducibility = (
              rabin_checks | regular_partitions | multi_checks |
              special_checks | exception_partitions
          )
          expected[names[53]] = {
              native('v15_allVoightPolynomialRows_length')
          }
          special_no_quartic = {
              native('v15_voightSpecialEightFactorizationThree_valid'),
              native('v15_voightSpecialEightFactorizationFive_valid'),
              native('v15_voightSpecialEight_forces_constant_three'),
              native('v15_voightSpecialEight_forces_constant_five'),
          }
          expected[names[54]] = standard | special_no_quartic
          expected[names[55]] = standard | special_checks
          expected[names[56]] = standard | all_irreducibility
          total_reality_dir = Path(
              'TraceEuclidean/V15VoightTotalRealityCertificates'
          )
          total_reality_checks = {
              native(theorem)
              for path in total_reality_dir.glob('*.lean')
              for theorem in re.findall(
                  r'^theorem\s+(\S+_check)\s*:',
                  path.read_text(encoding='utf-8'), re.M
              )
          }
          expected[names[57]] = standard | total_reality_checks
          expected[names[58]] = (
              standard | {voight_rows} | all_irreducibility |
              total_reality_checks
          )
          for name in names:
              match = re.search("'" + re.escape(name) + r"' depends on axioms: \[([^]]*)\]", output)
              if match is None:
                  raise SystemExit(f'Missing axiom audit output: {name}')
              axioms = {item.strip().rstrip('✝') for item in match.group(1).split(',')}
              if axioms != expected[name]:
                  raise SystemExit(f'Unexpected axiom set for {name}: {axioms}')
          print(f'NUMERICAL AXIOM AUDIT: PASS ({len(names)} declarations)')
          PY

      - name: Validate archived Voight data and generated Lean source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install sympy==1.14.0 mpmath==1.3.0
          python Trace-Euclidean/tools/generate_voight_discriminant_data.py --check
          python Trace-Euclidean/tools/generate_voight_irreducibility_certificates.py --check
          python Trace-Euclidean/tools/generate_voight_exception_irreducibility_certificates.py --check
          python Trace-Euclidean/tools/generate_voight_total_reality_certificates.py --check

      - name: Rerun public v15 Python certificates
        shell: bash
        run: |
          set -euo pipefail
          python Trace-Euclidean/tools/verify_public_v15.py

      - name: Verify clean generated state
        shell: bash
        run: test -z "$(git status --porcelain)"
