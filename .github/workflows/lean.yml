name: Trace-Euclidean hosted checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trace-euclidean-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned core Lean targets
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: Trace-Euclidean/lean
          auto-config: false
          build: true
          build-args: TraceEuclidean.TraceProductCoordinates TraceEuclidean.PoitouDegreeElevenClosed
          use-mathlib-cache: true
          use-github-cache: false

      - name: Reject unfinished or non-kernel proof constructs in kernel-only modules
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '(^|[^[:alpha:]])sorry([^[:alpha:]]|$)|sorryAx|^[[:space:]]*axiom[[:space:]]|native_decide|run_tac|^[[:space:]]*unsafe[[:space:]]|^[[:space:]]*extern[[:space:]]|implemented_by' -- 'Trace-Euclidean/lean/*.lean' 'Trace-Euclidean/lean/**/*.lean' ':(exclude)Trace-Euclidean/lean/LeanCert/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/OdlyzkoNumerical.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightDiscriminantData.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightResultantCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightIrreducibilityCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightIrreducibilityCertificates.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightExceptionalIrreducibilityCertificates.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightAllIrreducible.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightTotalRealityCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightIntegralBasisCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightIntegralBasisCertificates.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightSquarefreeIndexOne.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightSquarefreeExact.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderCertificates.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderIndexOneCertificates/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderIndexOneCertificates.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderExact/**' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderExact.lean' ':(exclude)Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderPilot.lean'; then
            echo 'Forbidden proof construct found.' >&2
            exit 1
          fi

      - name: Reject unfinished constructs in numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          # These files use native_decide; its compiler trust is audited separately.
          if git grep -n -E '^[[:space:]]*(sorry|axiom|unsafe|extern|run_tac)([[:space:]]|$)|sorryAx|implemented_by' -- 'Trace-Euclidean/lean/LeanCert/**/*.lean' 'Trace-Euclidean/lean/TraceEuclidean/OdlyzkoNumerical.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightDiscriminantData.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightResultantCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/VoightIrreducibilityCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/VoightIrreducibilityCertificates.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightExceptionalIrreducibilityCertificates.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightAllIrreducible.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightTotalRealityCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/VoightIntegralBasisCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/VoightIntegralBasisCertificates.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightSquarefreeIndexOne.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightSquarefreeExact.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderCertificates.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderIndexOneCertificates/**' 'Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderIndexOneCertificates.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderExact/**' 'Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderExact.lean' 'Trace-Euclidean/lean/TraceEuclidean/VoightMaximalOrderPilot.lean'; then
            echo 'Unfinished construct found in a numerical dependency.' >&2
            exit 1
          fi

      - name: Audit product coordinates and degree-eleven numerical proof
        working-directory: Trace-Euclidean/lean
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f product-audit.log poitou-audit.log' EXIT
          lake env lean TraceEuclideanTest/TraceProductCoordinatesAudit.lean > product-audit.log 2>&1
          lake env lean TraceEuclideanTest/PoitouDegreeElevenAudit.lean > poitou-audit.log 2>&1
          python - <<'PY'
          from pathlib import Path
          import re

          standard = {'propext', 'Classical.choice', 'Quot.sound'}
          for module, log in (
              ('TraceProductCoordinatesAudit', 'product-audit.log'),
              ('PoitouDegreeElevenAudit', 'poitou-audit.log'),
          ):
              source = Path(f'TraceEuclideanTest/{module}.lean').read_text(encoding='utf-8')
              output = ' '.join(Path(log).read_text(encoding='utf-8').split())
              names = re.findall(r'^#print axioms\s+(\S+)', source, re.M)
              rows = re.findall(r"'([^']+)' depends on axioms: \[([^]]*)\]", output)
              reports = dict(rows)
              if not names or len(rows) != len(names):
                  raise SystemExit(f'Incomplete axiom audit for {module}')
              for name in names:
                  matches = [key for key in reports if key == name or key.endswith('.' + name)]
                  if len(matches) != 1:
                      raise SystemExit(f'Expected one axiom report for {name}, found {len(matches)}')
                  axioms = {item.strip().rstrip('✝') for item in reports[matches[0]].split(',') if item.strip()}
                  if not axioms <= standard:
                      raise SystemExit(f'Unexpected axiom set for {name}: {axioms}')
              print(f'{module}: PASS ({len(names)} declarations)')
          PY

      - name: Validate archived Voight data and generated Lean source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install sympy==1.14.0 mpmath==1.3.0
          python Trace-Euclidean/tools/generate_voight_discriminant_data.py --check
          python Trace-Euclidean/tools/generate_voight_irreducibility_certificates.py --check
          python Trace-Euclidean/tools/generate_voight_exception_irreducibility_certificates.py --check
          python Trace-Euclidean/tools/generate_voight_total_reality_certificates.py --check
          python Trace-Euclidean/tools/generate_voight_integral_basis_certificates.py --check
          python Trace-Euclidean/tools/audit_voight_maximal_order_certificates.py
          python Trace-Euclidean/tools/generate_voight_maximal_order_certificates.py --scope nontrivial --chunk-size 4 --chain-width 4
          python Trace-Euclidean/tools/generate_voight_maximal_order_certificates.py --scope index-one --chunk-size 4 --chain-width 4 --prerequisite-module TraceEuclidean.VoightMaximalOrderCertificates --module-prefix VoightMaximalOrderIndexOneCertificates
          python Trace-Euclidean/tools/generate_voight_maximal_order_exact.py --chunk-size 25 --chain-width 4

      - name: Rerun public Python certificates
        shell: bash
        run: |
          set -euo pipefail
          python Trace-Euclidean/tools/verify_public.py

      - name: Verify clean generated state
        shell: bash
        run: test -z "$(git status --porcelain)"
