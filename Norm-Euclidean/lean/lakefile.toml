name = "normEuclidean"
version = "0.1.0"
defaultTargets = ["NormEuclidean"]

[[lean_lib]]
name = "NormEuclidean"

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[require]]
name = "BongTheory"
git = "https://github.com/hzldew-git/BongTheory.git"
rev = "a1343b6e471cbf417cab0e09dc5876b74358260a"

[[lean_lib]]
name = "ClassFieldTheory"
srcDir = "ArithmeticClassFields"
globs = ["ClassFieldTheory.+"]

[[lean_lib]]
name = "ValuedFieldTheory"
srcDir = "ArithmeticClassFields"
globs = ["ValuedFieldTheory.+"]

[[lean_lib]]
name = "GaloisCohomology"
srcDir = "ArithmeticClassFields"
globs = ["GaloisCohomology.+"]

[[lean_lib]]
name = "ProCGroups"
srcDir = "ArithmeticClassFields"
globs = ["ProCGroups.+"]
